[package]
name = "timekeeper"
version = "1.0.1"
description = "时约管家 Windows desktop scheduler"
authors = ["TimeKeeper"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The Windows desktop binary links this library directly. Mobile/static/dynamic
# library artifacts are outside the product boundary and trigger unnecessary
# native CRT linking on current MSVC toolchains.
name = "timekeeper_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = "0.13"
futures-util = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-stronghold = "2"
iota_stronghold = "2.1.0"
zeroize = "1.9.0"
rust-argon2 = "2.1.0"
getrandom = "0.3.4"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.5", features = ["v7", "serde"] }
thiserror = "2.0.18"
calamine = { version = "0.36.0", features = ["chrono"] }
sha2 = "0.11.0"
hex = "0.4.3"
arboard = { version = "3.6.1", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tokio = { version = "1.52.3", features = ["sync", "time", "rt"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono", "migrate"] }

[profile.dev.package.rust-argon2]
opt-level = 3

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

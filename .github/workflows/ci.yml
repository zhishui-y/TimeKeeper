name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Lint frontend
        run: pnpm lint

      - name: Typecheck frontend and tooling
        run: pnpm typecheck

      - name: Test frontend with coverage
        run: pnpm test:coverage

      - name: Build frontend
        run: pnpm exec vite build

      - name: Check production Tauri CSP contract
        run: pnpm check:csp

      - name: Enforce frontend bundle budgets
        run: pnpm check:bundle-size

      - name: Audit production frontend dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Lint Rust targets
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test Rust release build
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked

      - name: Run the explicit 10k functional performance gate
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked release_ten_thousand_appointment_performance_targets -- --ignored

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Test three responsive browser viewports
        run: pnpm test:e2e

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Verify the RSA advisory exception is unreachable
        shell: pwsh
        run: |
          $reachableRsa = cargo tree --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc --edges "normal,build" --invert rsa
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect the production Rust dependency tree"
          }
          if ($reachableRsa) {
            throw "RUSTSEC-2023-0071 may only remain ignored while rsa is absent from the production dependency tree"
          }

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

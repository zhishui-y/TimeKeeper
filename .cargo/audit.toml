# `rsa` is locked only as an optional SQLx MySQL dependency. TimeKeeper enables
# SQLite exclusively, and the Windows release dependency tree does not contain
# `rsa`. Verify that invariant with `cargo tree -e normal -i rsa` before applying
# this no-fixed-version advisory exception.
[advisories]
ignore = ["RUSTSEC-2023-0071"]
severity_threshold = "medium"

[target]
arch = ["x86_64"]
os = ["windows"]
